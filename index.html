                      <option value="J">Jelek (J)</option>
                      <option value="JS">Sangat Jelek (JS)</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Tombol Kalkulasi GG (Desktop & Mobile) -->
          <button
            onclick="hitungGG()"
            class="w-full py-3.5 bg-[#1f1a30] hover:bg-[#373153] active:scale-95 text-[#ffffff] font-extrabold text-sm rounded-2xl shadow-lg transition-all duration-200 flex items-center justify-center gap-2 border border-[#373153] cursor-pointer group"
          >
            <i
              class="fa-solid fa-bolt text-[#d0cde1] group-hover:scale-125 transition-transform"
            ></i>
            PROSES KALKULASI GG
          </button>
        </div>

        <!-- Kolom Kanan: Dashboard Hasil Analisis (5 Kolom di PC, Sticky di Top saat Scroll PC) -->
        <div class="lg:col-span-5 lg:sticky lg:top-6 space-y-4">
          <div
            class="bg-[#464165] rounded-2xl shadow-md border border-[#373153] p-4 lg:p-6 space-y-4"
          >
            <div
              class="flex items-center justify-between pb-1 border-b border-[#373153]"
            >
              <span
                class="text-xs font-bold text-[#d0cde1] uppercase tracking-wider flex items-center gap-1.5"
              >
                <i class="fa-solid fa-chart-pie text-[#ffffff]"></i> Ringkasan
                Hasil
              </span>
            </div>

            <!-- Card Rata-Rata -->
            <div
              class="bg-[#1f1a30] text-[#ffffff] rounded-xl p-5 shadow-inner text-center border border-[#373153] transform hover:scale-[1.02] transition-transform"
            >
              <span
                class="text-[10px] text-[#d0cde1] uppercase tracking-widest font-bold block mb-1"
              >
                Rata-Rata INT ZNT / m²
              </span>
              <div
                id="resRataRataM2"
                class="text-2xl lg:text-3xl font-black text-[#ffffff] my-1"
              >
                Rp 0
              </div>
              <span class="text-[10px] text-[#d0cde1]/80">
                Hasil gabungan 3 titik sampel
              </span>
            </div>

            <!-- Breakdown per Sampel -->
            <div
              class="bg-[#373153] rounded-xl p-3.5 space-y-2.5 text-xs border border-[#1f1a30]"
            >
              <div
                class="flex justify-between items-center hover:bg-[#1f1a30]/40 p-1 rounded transition-colors"
              >
                <span class="text-[#d0cde1] flex items-center gap-1.5">
                  <span
                    class="w-2 h-2 rounded-full bg-indigo-400 inline-block"
                  ></span>
                  Sampel 1:
                </span>
                <span id="resVal1" class="font-bold text-[#ffffff]"
                  >Rp 0 / m²</span
                >
              </div>
              <div
                class="flex justify-between items-center hover:bg-[#1f1a30]/40 p-1 rounded transition-colors"
              >
                <span class="text-[#d0cde1] flex items-center gap-1.5">
                  <span
                    class="w-2 h-2 rounded-full bg-purple-400 inline-block"
                  ></span>
                  Sampel 2:
                </span>
                <span id="resVal2" class="font-bold text-[#ffffff]"
                  >Rp 0 / m²</span
                >
              </div>
              <div
                class="flex justify-between items-center hover:bg-[#1f1a30]/40 p-1 rounded transition-colors"
              >
                <span class="text-[#d0cde1] flex items-center gap-1.5">
                  <span
                    class="w-2 h-2 rounded-full bg-violet-400 inline-block"
                  ></span>
                  Sampel 3:
                </span>
                <span id="resVal3" class="font-bold text-[#ffffff]"
                  >Rp 0 / m²</span
                >
              </div>
            </div>

            <!-- Metric Deviasi -->
            <div class="grid grid-cols-2 gap-2.5 text-center text-xs">
              <div
                class="bg-[#373153] p-3 rounded-xl border border-[#1f1a30] hover:border-[#5d587c] transition-colors"
              >
                <span
                  class="block text-[10px] text-[#d0cde1] font-medium uppercase mb-1"
                  >Std Deviasi</span
                >
                <span id="resStdDev" class="font-bold text-[#ffffff] text-sm"
                  >Rp 0</span
                >
              </div>
              <div
                class="bg-[#373153] p-3 rounded-xl border border-[#1f1a30] hover:border-[#5d587c] transition-colors"
              >
                <span
                  class="block text-[10px] text-[#d0cde1] font-medium uppercase mb-1"
                  >Deviasi Relatif</span
                >
                <span
                  id="resDeviasiPersen"
                  class="font-bold text-[#d0cde1] text-sm"
                  >0.00%</span
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
      const KOREKSI_HAK = { HM: 0, HGB: 5, HP: 5, HGU: 5, TMA: 10 }
      const BIAYA_STANDAR = { B: 2000000, R: 3000000 }

      function switchTab(index) {
        for (let i = 1; i <= 3; i++) {
          const form = document.getElementById(`formSampel_${i}`)
          const btn = document.getElementById(`tabBtn_${i}`)
          if (i === index) {
            form.classList.remove('hidden')
            btn.className =
              'flex-1 py-2.5 text-xs font-bold rounded-xl transition-all duration-200 bg-[#1f1a30] text-[#ffffff] shadow-sm flex items-center justify-center gap-1.5 cursor-pointer hover:bg-[#373153]'
          } else {
            form.classList.add('hidden')
            btn.className =
              'flex-1 py-2.5 text-xs font-bold rounded-xl transition-all duration-200 text-[#d0cde1] hover:bg-[#373153]/60 flex items-center justify-center gap-1.5 cursor-pointer'
          }
        }
      }

      function toggleBangunan(index) {
        const jenis = document.getElementById(`jenisObjek_${index}`).value
        const sec = document.getElementById(`secBangunan_${index}`)
        const inputBiaya = document.getElementById(
          `biayaBangunanPerM2_${index}`,
        )

        if (jenis === 'TK' || !jenis) {
          sec.classList.add('hidden')
        } else {
          sec.classList.remove('hidden')
          if (inputBiaya && !inputBiaya.value) {
            inputBiaya.value = BIAYA_STANDAR[jenis] || 2000000
          }
        }
      }

      function formatRupiah(number) {
        return new Intl.NumberFormat('id-ID', {
          style: 'currency',
          currency: 'IDR',
          maximumFractionDigits: 0,
        }).format(number)
      }

      function getPersenPenyusutan(umur, kondisi) {
        let baseRate = umur * 0.6
        const modifier = { BS: -5, B: 0, S: 5, J: 10, JS: 15 }
        let finalRate = baseRate + (modifier[kondisi] || 0)
        return Math.max(0, Math.min(80, Math.ceil(finalRate)))
      }

      function hitungNilaiPerM2(index) {
        const TAHUN_ACUAN = 2026
        const TANGGAL_CUTOFF = new Date('2026-12-31')

        const jenisObjek = document.getElementById(`jenisObjek_${index}`).value
        const statusKepemilikan = document.getElementById(
          `statusKepemilikan_${index}`,
        ).value
        const jenisData = document.getElementById(`jenisData_${index}`).value
        const tglTransVal = document.getElementById(
          `tanggalTransaksi_${index}`,
        ).value
        const tglTrans = tglTransVal
          ? new Date(tglTransVal)
          : new Date('2026-10-04')
        const hargaAwal =
          parseFloat(document.getElementById(`hargaAwal_${index}`).value) || 0
        const luasTanah =
          parseFloat(document.getElementById(`luasTanah_${index}`).value) || 0

        if (luasTanah <= 0 || hargaAwal <= 0) return 0

        const hargaPenyesuaian =
          jenisData === 'Penawaran' ? hargaAwal * 0.9 : hargaAwal

        let nilaiBangunan = 0
        if (jenisObjek && jenisObjek !== 'TK') {
          const luasBangunan =
            parseFloat(
              document.getElementById(`luasBangunan_${index}`).value,
            ) || 0
          const biayaPerM2 =
            parseFloat(
              document.getElementById(`biayaBangunanPerM2_${index}`).value,
            ) || 0
          const thnBuat =
            parseInt(
              document.getElementById(`tahunPembuatan_${index}`).value,
            ) || TAHUN_ACUAN
          const thnRenov =
            parseInt(document.getElementById(`tahunRenovasi_${index}`).value) ||
            thnBuat
          const kondisiFisik =
            document.getElementById(`kondisiFisik_${index}`).value || 'B'

          let umurEfektif = Math.ceil(
            (TAHUN_ACUAN - thnBuat + 2 * (TAHUN_ACUAN - thnRenov)) / 3,
          )
          if (umurEfektif < 0) umurEfektif = 0

          const persenPenyusutan = getPersenPenyusutan(
            umurEfektif,
            kondisiFisik,
          )
          const rcn = luasBangunan * biayaPerM2
          nilaiBangunan = rcn * (1 - persenPenyusutan / 100)
        }

        const hargaTanahMurni = Math.max(0, hargaPenyesuaian - nilaiBangunan)
        const diffDays = (TANGGAL_CUTOFF - tglTrans) / (1000 * 60 * 60 * 24)
        const persenPenyesuaianWaktu = (diffDays / 365) * 10
        const persenPenyesuaianHak = KOREKSI_HAK[statusKepemilikan] || 0

        const totalPersenPenyesuaian =
          persenPenyesuaianWaktu / 100 + persenPenyesuaianHak / 100
        const nilaiTanahTotal = hargaTanahMurni * (1 + totalPersenPenyesuaian)

        return nilaiTanahTotal / luasTanah
      }

      function hitungGG() {
        const v1 = hitungNilaiPerM2(1)
        const v2 = hitungNilaiPerM2(2)
        const v3 = hitungNilaiPerM2(3)

        const arr = [v1, v2, v3]
        const mean = (v1 + v2 + v3) / 3

        const variance =
          arr.reduce((acc, val) => acc + Math.pow(val - mean, 2), 0) /
          (arr.length - 1)
        const stdDev = Math.sqrt(variance)
        const deviasiPersen = mean > 0 ? (stdDev / mean) * 100 : 0

        document.getElementById('resVal1').innerText =
          formatRupiah(v1) + ' / m²'
        document.getElementById('resVal2').innerText =
          formatRupiah(v2) + ' / m²'
        document.getElementById('resVal3').innerText =
          formatRupiah(v3) + ' / m²'

        document.getElementById('resRataRataM2').innerText =
          formatRupiah(mean) + ' / m²'
        document.getElementById('resStdDev').innerText = formatRupiah(
          isNaN(stdDev) ? 0 : stdDev,
        )
        document.getElementById('resDeviasiPersen').innerText =
          (isNaN(deviasiPersen) ? 0 : deviasiPersen).toFixed(2) + '%'
      }

      window.onload = function () {
        hitungGG()
      }
    </script>
  </body>
</html>
